name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # ปุ่ม Run workflow / เมนู "เผยแพร่เว็บ" ใน Google Sheet
  schedule:
    - cron: '0 18 * * *' # ทุกวัน 01:00 เวลาไทย — ดึงข้อมูลล่าสุดจาก Sheet

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build # ดึงข้อมูลจาก Sheet + ย่อรูป + next build → out/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
